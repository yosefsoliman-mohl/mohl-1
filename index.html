<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>MoHL Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left nav + sticky top bar + scrolling workspace; auth is a split brand panel + form. Tokens follow the MoHL deck (copper + navy on warm paper). */
:root{
  --bg:#f7f3ef; --surface:#ffffff; --surface-2:#fbf7f3; --line:#ece3da; --line-2:#e2d6cb;
  --ink:#13235b; --text:#2d3550; --muted:#6c7189;
  --accent:#9a4f24; --accent-strong:#7c3d1a; --accent-soft:#fbe7d8; --accent-tint:#fdf3eb; --on-accent:#ffffff;
  --good:#1f8a4c; --good-soft:#e2f4e9; --warn:#b8720f; --warn-soft:#fdf0d7; --bad:#c2412f; --bad-soft:#fbe4e0;
  --info:#2d5fbf; --info-soft:#e6eefc; --purple:#6a4bc4; --purple-soft:#efe9fb;
  --f1:#7a3d1b; --f2:#b8692f; --f3:#e3a465; --f4:#f6cfc6;
  --shadow:0 1px 2px rgba(60,35,15,.05),0 6px 20px rgba(60,35,15,.05);
  --display:"Outfit",ui-sans-serif,system-ui,sans-serif; --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --r-s:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16120f; --surface:#201a16; --surface-2:#272019; --line:#352c25; --line-2:#433830;
  --ink:#f4ebe2; --text:#e0d6cc; --muted:#a69a8f;
  --accent:#d6864f; --accent-strong:#e9a06d; --accent-soft:#3d2a1c; --accent-tint:#2b2019; --on-accent:#1a110b;
  --good:#5cc78a; --good-soft:#1d3326; --warn:#e3a94a; --warn-soft:#3a2d17; --bad:#ec7a68; --bad-soft:#3b211d;
  --info:#8bb0f2; --info-soft:#1e2a40; --purple:#b49df0; --purple-soft:#2b2440;
  --f1:#c97a45; --f2:#a75e2c; --f3:#7f4a26; --f4:#5a3a2e; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16120f; --surface:#201a16; --surface-2:#272019; --line:#352c25; --line-2:#433830;
  --ink:#f4ebe2; --text:#e0d6cc; --muted:#a69a8f;
  --accent:#d6864f; --accent-strong:#e9a06d; --accent-soft:#3d2a1c; --accent-tint:#2b2019; --on-accent:#1a110b;
  --good:#5cc78a; --good-soft:#1d3326; --warn:#e3a94a; --warn-soft:#3a2d17; --bad:#ec7a68; --bad-soft:#3b211d;
  --info:#8bb0f2; --info-soft:#1e2a40; --purple:#b49df0; --purple-soft:#2b2440;
  --f1:#c97a45; --f2:#a75e2c; --f3:#7f4a26; --f4:#5a3a2e; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);color:var(--ink);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,3vw,34px);font-weight:700}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px}.ic.l{width:26px;height:26px}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-s);padding:9px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--on-accent);white-space:nowrap;transition:background .15s,transform .05s}
.btn:hover{background:var(--accent-strong)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--accent);border-color:var(--accent)}
.btn.ghost:hover{background:var(--accent-tint)}
.btn.soft{background:var(--accent-soft);color:var(--accent-strong)}
.btn.soft:hover{background:var(--accent-tint)}
.btn.plain{background:transparent;color:var(--text);border-color:var(--line-2)}
.btn.plain:hover{background:var(--surface-2)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:13px}
.link:hover{text-decoration:underline}

/* form */
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:13px;color:var(--ink)}
.inp{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:10px 12px;outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp[readonly],.inp.locked{background:var(--surface-2);color:var(--muted)}
textarea.inp{resize:vertical;min-height:84px}
.inp-wrap{position:relative}
.inp-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.inp-wrap .inp{padding-left:38px}
.inp-wrap .suffix{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.err{color:var(--bad);font-size:13px}
.hint{color:var(--muted);font-size:13px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.chk input{accent-color:var(--accent);width:16px;height:16px}

/* chips / pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-acc{background:var(--accent-soft);color:var(--accent-strong)}
.p-act{background:var(--info-soft);color:var(--info)}
.p-acq{background:var(--warn-soft);color:var(--warn)}
.p-ret{background:var(--purple-soft);color:var(--purple)}
.p-val{background:var(--good-soft);color:var(--good)}
.p-mut{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.p-good{background:var(--good-soft);color:var(--good)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.seg.light button.on{background:var(--accent-soft);color:var(--accent-strong)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;min-width:0}
.card.pad-s{padding:14px}
.bubble{width:46px;height:46px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;flex:none}
.bubble.lg{width:72px;height:72px}.bubble.lg .ic{width:30px;height:30px}
.bubble.sm{width:36px;height:36px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:grid;gap:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.strong{font-weight:600;color:var(--ink)}
.divider{height:1px;background:var(--line);margin:4px 0}

/* auth */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-brand{background:linear-gradient(155deg,#7a3a17 0%,#a85a2a 45%,#d99360 100%);color:#fff7f0;padding:40px max(40px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:32px;position:relative;overflow:hidden}
.auth-brand h2{color:#fff;font-size:clamp(28px,3.2vw,40px);font-weight:700;line-height:1.1;max-width:14ch}
.auth-brand p{color:#ffe9da;max-width:42ch}
.auth-brand .logo-txt b{color:#fff}.auth-brand .logo-txt span{color:#ffe0cc}
.mock{background:rgba(255,255,255,.96);border-radius:14px;padding:16px;color:#2d3550;box-shadow:0 20px 50px rgba(60,20,0,.35);max-width:440px;display:grid;gap:12px}
.mock .t{font-family:var(--display);font-weight:600;color:#13235b}
.mock-k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mock-k div{border:1px solid #efe5dc;border-radius:10px;padding:8px 10px}
.mock-k b{display:block;font-family:var(--display);font-size:18px;color:#13235b}
.mock-k small{color:#6c7189;font-size:11px}
.mock-k i{color:#1f8a4c;font-style:normal;font-size:11px;font-weight:600}
.auth-form{display:grid;place-items:center;padding:40px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.auth-box{width:100%;max-width:420px;display:grid;gap:20px}
.auth-box h1{font-size:30px}
.oauth{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-2)}
.steps{display:flex;gap:6px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--line-2)}
.steps i.on{background:var(--accent)}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500}
.choice button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.strength{display:flex;gap:4px}.strength i{height:4px;flex:1;border-radius:3px;background:var(--line-2)}
.demo-card{border:1px dashed var(--line-2);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface-2)}

/* landing */
.lp{background:var(--bg);min-height:100%;overflow-x:clip}
.lp-w{max-width:1160px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.lp-nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.lp-nav .lp-w{display:flex;align-items:center;gap:16px;height:68px}
.lp-nav .logo{padding:0}
.lp-links{display:flex;gap:2px;margin-left:12px}
.lp-links button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--text);font-weight:500;cursor:pointer;font-size:15px}
.lp-links button:hover{background:var(--surface-2);color:var(--ink)}
.lp-cta{margin-left:auto;display:flex;gap:8px;align-items:center}
.lp-sec{padding:96px 0}
.lp-sec.alt{background:var(--surface);border-block:1px solid var(--line)}
.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:999px;background:var(--accent-tint);border:1px solid var(--accent-soft);color:var(--accent-strong);font-weight:600;font-size:13px}
.lp h1{font-size:clamp(38px,5.2vw,62px);line-height:1.04;font-weight:700;letter-spacing:-.028em}
.lp h1 em,.lp h2 em{font-style:normal;color:var(--accent)}
.lp-lead{font-size:clamp(17px,1.35vw,19px);color:var(--muted);max-width:54ch;line-height:1.6;margin:0}
.lp h2{font-size:clamp(30px,3.5vw,44px);line-height:1.1;font-weight:700;letter-spacing:-.022em}
.lp-head{display:grid;gap:14px;justify-items:center;text-align:center;max-width:720px;margin:0 auto 52px}
.btn.lg{padding:13px 22px;font-size:16px;border-radius:10px}
.hero{padding:72px 0 88px}
.hero-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:64px;align-items:center}
.hero-copy{display:grid;gap:24px;justify-items:start}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.checks{display:flex;gap:8px 20px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.checks span{display:inline-flex;gap:6px;align-items:center}.checks .ic{color:var(--good);width:16px;height:16px}
.hv{position:relative;padding:20px 8px}
.hv-main{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 40px 80px -30px rgba(80,35,10,.35),0 2px 6px rgba(60,35,15,.06);padding:18px;display:grid;gap:14px}
.hv-bar{display:flex;align-items:center;gap:6px}.hv-bar i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.hv-bar b{margin-left:8px;font-family:var(--display);color:var(--ink);font-size:15px}.hv-bar .pill{margin-left:auto}
.hv-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hv-k div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);min-width:0}
.hv-k small{display:block;color:var(--muted);font-size:11.5px}
.hv-k b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);line-height:1.2}
.hv-k i{font-style:normal;color:var(--good);font-size:11.5px;font-weight:600}
.hv-rows{display:grid;gap:9px}
.hv-row{display:grid;grid-template-columns:22px 70px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12.5px;color:var(--text)}
.hv-row .logo-i{width:20px;height:20px}
.hv-row>span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hv-row span:last-child{text-align:right;font-weight:600;color:var(--ink)}
.hv-track{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}.hv-track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--f2),var(--f3))}
.hv-f{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 18px 40px -16px rgba(80,35,10,.35);display:flex;gap:10px;align-items:center;font-size:13px;animation:lpfloat 6s ease-in-out infinite}
.hv-f b{display:block;color:var(--ink);font-size:13.5px}.hv-f small{color:var(--muted);font-size:12px}
.hv-f .bubble{width:34px;height:34px}.hv-f .bubble .ic{width:17px;height:17px}
.hv-f.f1{top:-6px;right:-18px}.hv-f.f2{bottom:-34px;left:-26px;animation-delay:-3s}
.hv-logos{display:flex}.hv-logos .logo-i{width:22px;height:22px;margin-left:-6px;background:var(--surface);border-radius:50%;padding:2px;box-shadow:0 0 0 1.5px var(--surface)}
@keyframes lpfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.strip-t{text-align:center;color:var(--muted);font-size:14px;font-weight:500;margin-bottom:22px}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 40px;align-items:center}
.strip span{display:inline-flex;gap:10px;align-items:center;font-family:var(--display);font-weight:600;color:var(--text);font-size:17px}
.strip .logo-i{width:28px;height:28px}
.swap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:28px;align-items:center}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tool{border:1px dashed var(--line-2);border-radius:12px;padding:14px;display:grid;gap:4px;background:var(--surface-2);position:relative}
.tool b{color:var(--ink);font-family:var(--display);font-size:15.5px;display:flex;gap:8px;align-items:center}
.tool b .ic{color:var(--muted);width:18px;height:18px}
.tool small{color:var(--muted);font-size:12.5px;line-height:1.4}
.tool .x{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center}
.tool .x .ic{width:12px;height:12px;stroke-width:2.6}
.swap-arrow{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(154,79,36,.6)}
.swap-arrow .ic{width:24px;height:24px}
.one{background:linear-gradient(155deg,#7a3a17 0%,#a85a2a 50%,#d99360 100%);color:#fff7f0;border-radius:18px;padding:28px;display:grid;gap:18px;box-shadow:0 30px 60px -24px rgba(122,58,23,.55)}
.one .logo-txt b{color:#fff}.one .logo-txt span{color:#ffe0cc}
.one h3{color:#fff;font-size:24px;line-height:1.2}
.one ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.one li{display:flex;gap:10px;align-items:flex-start;color:#fff3ea;font-size:15px}
.one li .ic{width:18px;height:18px;flex:none;margin-top:2px;background:rgba(255,255,255,.18);border-radius:50%;padding:2px;stroke-width:2.6}
.pains{margin-top:56px}
.pain{display:grid;gap:10px;align-content:start}
.pain h3{font-size:19px}.pain p{margin:0;color:var(--muted);line-height:1.55}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:16px;align-content:start;box-shadow:var(--shadow);transition:border-color .2s,transform .2s}
.fcard:hover{border-color:var(--accent-soft);transform:translateY(-2px)}
.fcard .top{display:flex;gap:14px;align-items:center}
.fcard h3{font-size:22px}.fcard .top small{display:block;color:var(--accent);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.fcard p{margin:0;color:var(--muted);line-height:1.55}
.fcard ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.fcard li{display:flex;gap:10px;align-items:flex-start;color:var(--text);font-size:15px}
.fcard li .ic{width:18px;height:18px;color:var(--good);margin-top:2px;stroke-width:2.4}
.repl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.repl span{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:line-through;text-decoration-color:var(--bad)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;counter-reset:how;position:relative}
.how::before{content:"";position:absolute;top:28px;left:16%;right:16%;border-top:2px dashed var(--line-2)}
.hstep{display:grid;gap:12px;justify-items:center;text-align:center;position:relative}
.hstep .n{width:56px;height:56px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;box-shadow:0 0 0 8px var(--bg)}
.lp-sec.alt .hstep .n{box-shadow:0 0 0 8px var(--surface)}
.hstep h3{font-size:20px}.hstep p{margin:0;color:var(--muted);max-width:32ch;line-height:1.55}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.nums div{border-left:3px solid var(--accent);padding:4px 0 4px 18px}
.nums b{display:block;font-family:var(--display);font-size:clamp(36px,4vw,48px);line-height:1;color:var(--ink);font-weight:700}
.nums span{color:var(--muted);font-size:15px}
.cmp{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.cmp th,.cmp td{padding:16px 20px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
.cmp tr:last-child td{border-bottom:0}
.cmp thead th{font-family:var(--display);font-size:16px;color:var(--ink);background:var(--surface-2)}
.cmp thead th:last-child{background:var(--accent-tint);color:var(--accent-strong)}
.cmp td:first-child{font-weight:600;color:var(--ink);width:24%}
.cmp td:nth-child(2){color:var(--muted)}
.cmp td:last-child{background:color-mix(in srgb,var(--accent-tint) 55%,transparent);color:var(--text)}
.cmp td .ic{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
.cmp td:nth-child(2) .ic{color:var(--bad)}.cmp td:last-child .ic{color:var(--good)}
.faq{max-width:780px;margin:0 auto;display:grid;gap:12px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 20px}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 0;font-family:var(--display);font-weight:600;color:var(--ink);font-size:17px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ic{transition:transform .2s;color:var(--accent)}
.faq details[open] summary .ic{transform:rotate(45deg)}
.faq details p{margin:0 0 18px;color:var(--muted);line-height:1.6}
.cta-band{background:linear-gradient(135deg,#6e3314 0%,#9a4f24 45%,#d08a55 100%);border-radius:24px;padding:64px 40px;text-align:center;display:grid;gap:18px;justify-items:center;color:#fff3ea;position:relative;overflow:hidden}
.cta-band h2{color:#fff;max-width:20ch}
.cta-band p{margin:0;color:#ffe6d4;max-width:52ch;font-size:18px}
.cta-band .btn{background:#fff;color:#7c3d1a}.cta-band .btn:hover{background:#fff3ea}
.cta-band .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}.cta-band .btn.ghost:hover{background:rgba(255,255,255,.12)}
.lp-foot{padding:48px 0 40px;border-top:1px solid var(--line);margin-top:96px}
.lp-foot .lp-w{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center}
.lp-foot nav{display:flex;flex-wrap:wrap;gap:4px 18px}
.lp-foot nav button{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0;font-size:14px}
.lp-foot nav button:hover{color:var(--ink)}
.back-home{justify-self:start;display:inline-flex;gap:6px;align-items:center}
.back-home .ic{transform:rotate(180deg)}


/* included-with comparison */
.inc{background:radial-gradient(120% 80% at 0% 0%,#1d3a8a 0%,transparent 55%),#0b1430;color:#e8ecf8;padding:96px 0}
.inc .lp-head h2{color:#fff}.inc .lp-head h2 em{color:#e9a06d}.inc .lp-lead{color:#aab3d1}
.inc .eyebrow{background:rgba(233,160,109,.12);border-color:rgba(233,160,109,.3);color:#f0b98d}
.inc-t{display:grid;gap:12px;max-width:1080px;margin:0 auto}
.inc-h,.inc-r{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1.25fr) minmax(0,1fr) minmax(0,.75fr);align-items:center}
.inc-h{padding:0 24px 6px;font-family:var(--display);font-weight:600;font-size:clamp(16px,1.6vw,21px);color:#fff}
.inc-h>span:nth-child(n+3){text-align:center}
.inc-brand{display:inline-flex;gap:8px;align-items:center;justify-content:center}
.inc-r{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:16px;min-height:76px;padding:10px 24px;transition:background .2s,border-color .2s}
.inc-r:hover{background:rgba(255,255,255,.07);border-color:rgba(233,160,109,.35)}
.inc-r>*{padding:6px 0}
.inc-r>*+*{border-left:1px solid rgba(255,255,255,.1);padding-left:20px}
.inc-f{font-family:var(--display);font-size:14.5px;letter-spacing:.06em;text-transform:uppercase;color:#fff;font-weight:600;padding-right:16px}
.inc-l{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inc-l img{width:40px;height:40px;border-radius:50%;background:#fff;padding:6px;object-fit:contain;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.inc-l small{color:#8d97b8;font-size:13px}
.inc-p{text-align:center;font-family:var(--display);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#fff;font-size:15px}
.inc-p.u{color:#f0b98d}
.inc-p.u::before{content:none!important}
.inc-c{display:grid;place-items:center}
.inc-c i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(233,160,109,.14);border:1px solid rgba(233,160,109,.45);color:#f0b98d}
.inc-c .ic{width:18px;height:18px;stroke-width:2.6}
.inc-tot{background:rgba(233,160,109,.08);border-color:rgba(233,160,109,.35);min-height:88px}
.inc-tot .inc-tl{grid-column:1/3;text-align:right;padding-right:24px;font-family:var(--display);font-weight:700;letter-spacing:.08em;color:#f0b98d;font-size:17px;text-transform:uppercase}
.inc-tot .inc-p{font-size:17px;border-left:1px solid rgba(255,255,255,.1)}
.inc-mohl{text-align:center;display:grid;gap:6px;justify-items:center}
.inc-mohl b{font-family:var(--display);font-size:22px;color:#fff;line-height:1}
.inc-mohl .inc-price{font-size:clamp(30px,3vw,40px);font-weight:700;color:#f0b98d;letter-spacing:-.02em}
.inc-price sup{font-size:.45em;vertical-align:top;position:relative;top:.2em;margin-right:2px}
.inc-mohl small{color:#aab3d1;font-size:12px;margin-top:-4px}
.inc-mohl .btn{padding:6px 12px;font-size:13px}
.inc-note{max-width:1080px;margin:18px auto 0;color:#8d97b8;font-size:12.5px;text-align:center}

/* app shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--surface-2);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;text-decoration:none}
.logo-txt b{display:block;font-family:var(--display);font-size:24px;line-height:1;color:var(--accent)}
.logo-txt span{font-size:11px;color:var(--muted)}
.nav-i{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:var(--ink);font-weight:500;font-size:14px}
.nav-i:hover{background:var(--accent-tint)}
.nav-i .ic{color:var(--accent)}
.nav-i.on{background:var(--accent);color:var(--on-accent)}
.nav-i.on .ic{color:var(--on-accent)}
.nav-i.head{font-weight:700}
.nav-i.head.open-on{background:var(--accent);color:var(--on-accent)}.nav-i.head.open-on .ic{color:var(--on-accent)}
.nav-i .chev{margin-left:auto;transition:transform .2s}
.nav-i.collapsed .chev{transform:rotate(-90deg)}
.nav-sub{display:grid;gap:2px;margin:2px 0 8px}
.nav-sub .nav-i{font-size:13.5px;padding:7px 12px}
.nav-sub .nav-i.on{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.nav-sub .nav-i.on .ic{color:var(--accent)}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 28px}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;color:var(--muted);cursor:pointer;text-align:left}
.search kbd{margin-left:auto;font:12px var(--body);color:var(--muted)}
.icon-btn{position:relative;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.me{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:10px;text-align:left}
.me:hover{background:var(--surface-2)}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-family:var(--display);flex:none}
.av.sm{width:36px;height:36px;font-size:13px}
.av.soft{background:var(--accent-soft);color:var(--accent-strong)}
.av.lg{width:84px;height:84px;font-size:28px}
.av.c1{background:var(--info-soft);color:var(--info)}.av.c2{background:var(--purple-soft);color:var(--purple)}.av.c3{background:var(--good-soft);color:var(--good)}
.me b{display:block;color:var(--ink);font-size:14px}.me small{color:var(--muted);font-size:12.5px}
.main{min-width:0}
.page{padding:24px 28px 48px;display:grid;gap:20px;max-width:1440px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:4px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:4px}
.crumbs button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer}
.crumbs button:hover{color:var(--accent)}
.menu-btn{display:none}
.pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(40,20,5,.14);min-width:240px;padding:6px;z-index:40}
.pop button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.pop button:hover{background:var(--surface-2)}
.notif{display:grid;gap:2px;padding:10px;border-radius:8px}
.notif:hover{background:var(--surface-2)}

/* banner */
.banner{display:flex;align-items:center;gap:16px;background:var(--accent-tint);border:1px solid var(--accent);border-radius:var(--r);padding:16px 20px;flex-wrap:wrap}
.banner .bubble{border-radius:10px;background:var(--accent-soft)}
.banner h3{font-size:18px}
.banner .btn{margin-left:auto}

/* KPIs */
.kpi{display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.kpi .v{font-family:var(--display);font-size:clamp(21px,1.1vw + 12px,26px);font-weight:600;color:var(--ink);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500;line-height:1.3;min-height:2.6em}
.kpi-f{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin-top:2px}
.delta{font-size:12.5px;font-weight:600;color:var(--good);display:inline-flex;gap:4px;align-items:center}
.delta.flat{color:var(--muted)}
.spark{width:84px;height:32px;flex:none;overflow:visible}
.logo-i{width:36px;height:36px;flex:none}
.hub{gap:20px;align-items:flex-start}
.hub .btn{max-width:100%;white-space:normal;text-align:left}

/* funnel */
.funnel{display:grid;gap:6px;justify-items:center}
.fun{color:#fff;text-align:center;padding:10px 0;font-size:13px;line-height:1.25;position:relative;clip-path:polygon(0 0,100% 0,94% 100%,6% 100%)}
.fun b{display:block;font-family:var(--display);font-size:19px}
.fun em{position:absolute;right:12%;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;opacity:.9}
.leg{display:grid;gap:0}
.leg div{display:grid;grid-template-columns:14px 1fr auto 52px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.leg i{width:10px;height:10px;border-radius:50%}
.leg span:last-child{color:var(--muted);text-align:right}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--ink);font-size:13px;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-tint)}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:36px 16px}
.empty .bubble{width:64px;height:64px}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.donut{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut div{width:96px;height:96px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted)}
.donut b{display:block;font-family:var(--display);font-size:20px;color:var(--ink)}
.legend-row{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:5px 0}
.legend-row i{width:10px;height:10px;border-radius:50%;flex:none}
.legend-row span:last-of-type{margin-left:auto}

/* list rows */
.act{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.act b{display:block;font-size:13.5px;color:var(--ink);font-weight:600}
.act small{display:block;color:var(--muted);font-size:12.5px}
.qa{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--surface-2);padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;text-align:left}
.qa:hover{border-color:var(--accent);background:var(--accent-tint)}
.qa .ic:first-child{color:var(--accent)}.qa .ic:last-child{margin-left:auto;color:var(--muted)}

/* tiles (template pickers) */
.tile{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;cursor:pointer;min-width:0;width:100%}
.tile:hover{border-color:var(--accent-strong)}
.tile.on{border-color:var(--accent);background:var(--accent-tint);box-shadow:0 0 0 1px var(--accent)}
.tile b{display:block;color:var(--ink);font-family:var(--display);font-weight:600;font-size:15.5px}
.tile small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.tile>.ic:last-child{margin-left:auto;color:var(--ink)}

/* flow */
.flow{display:grid;justify-items:center;gap:0;padding:12px 0;background-image:radial-gradient(var(--line-2) 1px,transparent 1px);background-size:16px 16px;border-radius:10px}
.step{width:min(100%,400px);display:flex;align-items:center;gap:14px;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left}
.step.on{border-color:var(--accent);background:var(--accent-tint);box-shadow:0 0 0 1px var(--accent)}
.step.static{cursor:default}
.step b{display:block;color:var(--ink);font-weight:600}
.step small{display:block;color:var(--muted);font-size:13px}
.step>.ic:last-child{margin-left:auto;color:var(--muted)}
.conn{width:2px;height:26px;background:var(--line-2);position:relative}
.conn::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--muted);transform:translate(-50%,-50%);opacity:.6}
.sb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.sb.trig{background:var(--info-soft);color:var(--info)}
.sb.send{background:var(--accent-soft);color:var(--accent)}
.sb.wait{background:var(--purple-soft);color:var(--purple)}
.sb.alt{background:var(--good-soft);color:var(--good)}

/* platform */
.plat{display:grid;justify-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 8px;cursor:pointer;font-weight:600;color:var(--ink);position:relative}
.plat:hover{border-color:var(--accent-strong)}
.plat.on{border-color:var(--accent);background:var(--accent-tint);box-shadow:0 0 0 1px var(--accent)}
.plat .tick{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.plat svg.logo-i{width:34px;height:34px}
.logo-s{width:20px;height:20px;flex:none}
.num-badge{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;font-weight:700;font-family:var(--display);flex:none}
.drop{border:1.5px dashed var(--accent);background:var(--accent-tint);border-radius:12px;display:grid;justify-items:center;text-align:center;gap:6px;padding:20px;cursor:pointer}
.adprev{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.adimg{aspect-ratio:1.25;max-width:100%;background:var(--surface-2);border-radius:8px;display:grid;place-items:center;color:var(--muted);overflow:hidden;text-align:center}
.adimg img{width:100%;height:100%;object-fit:cover}

/* stat line */
.kv{display:grid;grid-template-columns:auto 1fr;gap:14px 24px;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;color:var(--ink);font-weight:500}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.mini-stats div{padding:10px 0;border-bottom:1px solid var(--line)}
.mini-stats div:nth-child(odd){padding-right:12px;border-right:1px solid var(--line)}
.mini-stats div:nth-child(even){padding-left:16px}
.mini-stats small{display:block;color:var(--muted);font-size:13px}
.mini-stats b{font-family:var(--display);font-size:19px;color:var(--ink);font-weight:600}
.big{font-family:var(--display);font-size:28px;font-weight:600;color:var(--ink);line-height:1.15}

/* chat */
.inbox-item{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0}
.inbox-item:hover{background:var(--surface-2)}
.inbox-item.on{background:var(--accent-tint)}
.msgs{display:flex;flex-direction:column;gap:10px;padding:16px;overflow-y:auto;min-height:340px;max-height:460px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14.5px}
.msg.in{background:var(--surface-2);border:1px solid var(--line);align-self:flex-start}
.msg.out{background:var(--accent-soft);align-self:flex-end;color:var(--ink)}
.msg time{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}

/* phones */
.phone{width:100%;max-width:220px;border:6px solid #1d1d22;border-radius:26px;background:#fff;color:#1d2340;overflow:hidden;font-size:11px;position:relative;margin:0 auto}
.phone .bar{display:flex;justify-content:space-between;padding:6px 12px 2px;font-weight:600;font-size:10px}
.phone .nav{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-weight:600}
.phone .shoe{background:#f3ece6;margin:6px 10px;border-radius:8px;display:grid;place-items:center;aspect-ratio:1.5;position:relative}
.phone .shoe svg{width:70%}
.phone .pbody{padding:4px 12px 12px;display:grid;gap:6px}
.phone .price{color:#9a4f24;font-weight:700;font-size:13px}
.phone .pbtn{background:#8a4520;color:#fff;border-radius:6px;padding:7px;text-align:center;font-weight:600}
.phone .badge{position:absolute;font-size:9px;font-weight:700;padding:2px 7px}
.phone .sizes{display:flex;gap:4px}.phone .sizes span{flex:1;border:1px solid #ddd;border-radius:4px;text-align:center;padding:3px 0}
.phone .sizes span:first-child{border-color:#9a4f24;color:#9a4f24}
.phone .sticky{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eee;padding:8px 10px;gap:8px}
.vs{width:34px;height:34px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.variant-lbl{background:var(--accent-tint);text-align:center;padding:4px;border-radius:8px 8px 0 0;font-weight:600;font-size:13px;color:var(--ink)}

/* toggle */
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line-2);border-radius:22px;cursor:pointer;transition:.2s}
.switch span::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::before{transform:translateX(18px)}

/* modal / toast */
.scrim{position:fixed;inset:0;background:rgba(25,15,8,.45);display:grid;place-items:center;z-index:100;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:calc(100% - 20px);overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.3);display:grid}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-b{padding:20px 22px;display:grid;gap:16px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.code{background:#1e1813;color:#f3e3d4;border-radius:10px;padding:14px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:auto;white-space:pre}
.palette-list{display:grid;gap:2px;max-height:340px;overflow-y:auto}
.palette-list button{display:flex;gap:10px;align-items:center;border:0;background:none;padding:10px;border-radius:8px;cursor:pointer;text-align:left;width:100%}
.palette-list button.on,.palette-list button:hover{background:var(--accent-tint)}
.toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:calc(20px + env(safe-area-inset-right,0px));display:grid;gap:8px;z-index:200}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:500;animation:tin .25s ease}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.demo-tag{font-size:12px;color:var(--muted)}
.prev-email{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prev-email .hd{background:var(--surface-2);padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.prev-email .bd{padding:18px;display:grid;gap:14px}
.wa{background:#e7ddd3;border-radius:12px;padding:16px;display:grid}
.wa .b{background:#fff;color:#1d2340;border-radius:10px;padding:10px 12px;max-width:85%;font-size:14px}

/* responsive */
.side-scrim{display:none}
@media (max-width:1180px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split-3{grid-template-columns:1fr!important}}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .side-scrim.open{display:block;position:fixed;inset:0;background:rgba(25,15,8,.4);z-index:55}
  .menu-btn{display:inline-flex}
  .split{grid-template-columns:1fr!important}
  .auth{grid-template-columns:1fr}.auth-brand{display:none}
}
@media (max-width:640px){
  .top{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:6px}
  .search kbd,.me .who{display:none}
  .page{padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .g2,.g3,.g4,.g5{grid-template-columns:minmax(0,1fr)}
  .g5.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g5.kpis>:last-child{grid-column:1/-1}
  .hub{gap:14px}.hub .bubble.lg{width:52px;height:52px}
  .kpi .bubble{width:38px;height:38px}
  .spark{width:64px;height:28px}
  .oauth{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}
}
@media (max-width:980px){
  .lp-links{display:none}
  .hero{padding:48px 0 72px}.hero-g{grid-template-columns:minmax(0,1fr);gap:48px}
  .hv{max-width:560px;width:100%;justify-self:center}
  .swap{grid-template-columns:minmax(0,1fr)}.swap-arrow{justify-self:center;transform:rotate(90deg)}
  .feat{grid-template-columns:minmax(0,1fr)}
  .how{grid-template-columns:minmax(0,1fr);gap:36px}.how::before{display:none}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 20px}
}
@media (max-width:640px){
  .lp-sec{padding:64px 0}.lp-head{margin-bottom:36px}
  .lp-nav .lp-w{gap:8px;height:60px}.lp-nav .logo svg{width:30px;height:30px}
  .lp-cta{gap:4px}.lp-cta .btn{padding:8px 12px;font-size:14px}
  .hero-cta .btn{flex:1 1 auto}
  .tools{grid-template-columns:minmax(0,1fr)}
  .hv{padding:16px 0}.hv-f{font-size:12px;padding:8px 10px}.hv-f.f1{right:-4px;top:-10px}.hv-f.f2{left:-4px;bottom:-44px}
  .hv-k{gap:6px}.hv-k div{padding:8px}.hv-k b{font-size:16px}
  .hv-row{grid-template-columns:20px 62px minmax(0,1fr) 38px;gap:8px}
  .fcard{padding:22px}
  .cmp thead{display:none}
  .cmp tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--line)}
  .cmp tr:last-child{border-bottom:0}
  .cmp td{padding:12px 14px;font-size:14px;border-bottom:0;width:auto!important}
  .cmp td:first-child{grid-column:1/-1;padding-bottom:0;background:none}
  .cmp td:nth-child(2)::before,.cmp td:last-child::before{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .cmp td:nth-child(2)::before{content:"Separate tools";color:var(--muted)}
  .cmp td:last-child::before{content:"With MoHL";color:var(--accent-strong)}
  .cta-band{padding:44px 22px;border-radius:18px}
  .lp-foot{margin-top:64px}
  .inc{padding:64px 0}
  .inc-h{display:none}
  .inc-r{grid-template-columns:minmax(0,1fr) auto;gap:12px 14px;padding:16px 18px}
  .inc-r>*+*{border-left:0;padding-left:0}
  .inc-f{grid-column:1/-1;font-size:13.5px}
  .inc-l{grid-column:1/-1}.inc-l img{width:34px;height:34px;padding:5px}
  .inc-p{text-align:left;font-size:14px}.inc-p::before{content:"Other tools  ";color:#8d97b8;font-weight:500;letter-spacing:0;text-transform:none;font-size:12.5px}
  .inc-tot .inc-tl{grid-column:1/-1;text-align:left;padding-right:0}
  .inc-tot .inc-p{border-left:0}
  .inc-mohl{justify-items:end}
}
@media (max-width:380px){.lp-cta .icon-btn{display:none}}
</style>

const mem = {};
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){} return k in mem ? JSON.parse(mem[k]) : d; },
  set(k,v){ mem[k] = JSON.stringify(v); try{ localStorage.setItem(k, mem[k]); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} }
};
async function hash(pw){
  try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mohl:'+pw)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h=7; for(const c of pw) h=(h*31+c.charCodeAt(0))|0; return 'f'+h; }
}
function toast(msg, icon='checkc'){
  const t = document.createElement('div'); t.className='toast'; t.innerHTML = I(icon)+`<span>${esc(msg)}</span>`;

}

function spark(up=true){
  const line = up ? 'M2 26 C14 24 18 18 30 19 S46 12 58 13 S76 5 94 3' : 'M2 16 L94 16';
  const c = up ? 'var(--good)' : 'var(--muted)';
  return `<svg class="spark" viewBox="0 0 96 32" preserveAspectRatio="none" aria-hidden="true">${up?`<path d="${line} L94 32 L2 32Z" fill="${c}" fill-opacity=".12"/>`:''}<path d="${line}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${up?`<circle cx="94" cy="3" r="2.6" fill="${c}"/>`:''}</svg>`;
}
function kpiTiles(){

  return `<div class="grid g5 kpis">${list.map(x=>`<div class="card pad-s kpi"><div class="kpi-h"><span class="bubble">${I(x[0])}</span>${spark(d)}</div><div class="l">${x[1]}</div><div class="v num" title="${x[2]}">${x[2]}</div><div class="kpi-f"><span class="delta ${d?'':'flat'}">${I(d?'up':'flat','s')} ${d?'+'+x[3]:'0%'}</span><span class="tiny muted">vs. previous ${S.range} days</span></div></div>`).join('')}</div>`;
}
function funnelCard(){
  const d = hasData(), f = k();
  const st = [['Acquisition',100000,100,'var(--f1)'],['Activation',62450,62.5,'var(--f2)'],['Retention',35420,35.4,'var(--f3)'],['Customer Value',18230,18.2,'var(--f4)']];

  <div class="grid g2" style="align-items:center"><div class="funnel">${st.map((s,i)=>`<div class="fun" style="width:${100-i*14}%;background:${s[3]};${i==3?'color:var(--ink)':''}">${s[0]}<b class="num">${d?fmt(s[1]*f):0}</b><em>${d?s[2]+'%':'0%'}</em></div>`).join('')}</div>
  <div class="leg"><div style="border:0;padding-top:0"><span></span><b class="strong small">Funnel Breakdown</b></div>${st.map(s=>`<div><i style="background:${s[3]}"></i><span>${s[0]}</span><b class="num">${d?fmt(s[1]*f):0}</b><span>${d?s[2]+'%':'0%'}</span></div>`).join('')}</div></div></div>`;

function series(n, base, growth, seed){ const a=[]; let v=base; for(let i=0;i<n;i++){ v += growth + Math.sin(i*1.7+seed)*growth*1.6; a.push(v);} return a; }
function lineChart(){
  const d = hasData(), W0=520, H0=230, pl=44, pb=26;
  const ys = [0,25,50,75,100];
  const grid = ys.map(y=>{const yy = H0-pb-(y/100)*(H0-pb-10); return `<line x1="${pl}" x2="${W0}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${y?y+'K':'0'}</text>`;}).join('');
  const xl = ['Oct 10','Oct 17','Oct 24','Oct 31'].map((t,i)=>`<text x="${pl+20+i*((W0-pl-40)/3)}" y="${H0-6}" text-anchor="middle">${t}</text>`).join('');
  if(!d) return `<svg viewBox="0 0 ${W0} ${H0}">${grid}${xl}<text x="${(W0+pl)/2}" y="${H0/2}" text-anchor="middle" style="font-size:14px;fill:var(--ink);font-weight:600">No data yet</text></svg>`;
  const mk = (arr, col, fill) => { const pts = arr.map((v,i)=>[pl+i*((W0-pl)/(arr.length-1)), H0-pb-(v/100)*(H0-pb-10)]); const p = pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
    return (fill?`<path d="${p} L${W0} ${H0-pb} L${pl} ${H0-pb}Z" fill="${col}" opacity=".14"/>`:'')+`<path d="${p}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/><circle cx="${pts.at(-1)[0]-3}" cy="${pts.at(-1)[1]}" r="4" fill="${col}"/>`; };
  return `<svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="Total and active users over time">${grid}${xl}${mk(series(30,46,1.3,1),'var(--f3)',true)}${mk(series(30,27,.95,3),'var(--f1)',false)}</svg>`;
}
function donut(){

  let acc=0; const grad = ch.map(c=>{const s=acc; acc+=c[1]; return `${c[2]} ${s}% ${acc}%`;}).join(',');
  return `<div class="row" style="gap:24px;flex-wrap:wrap"><div class="donut" style="background:${d?`conic-gradient(${grad})`:'var(--line)'}"><div><span>Total Users<b class="num">${d?fmt(245689):0}</b></span></div></div>
  <div style="flex:1;min-width:180px">${ch.map(c=>`<div class="legend-row"><i style="background:${c[2]}"></i><span>${c[0]}</span><span class="num muted">${d?c[1]+'%':'0%'}</span></div>`).join('')}</div></div>`;
}

/* ---------- modals ---------- */

  setTimeout(()=>{ const f = $('#modal-root input:not([type=checkbox]):not([readonly]), #modal-root select'); f && f.focus(); }, 30);
}
const closeModal = () => $('#modal-root').innerHTML = '';
function sdkModal(tab='iOS'){
  const key = 'mk_live_' + (S.user.email.length*7919).toString(16) + 'a3f9';
  const code = {iOS:`// Package.swift\n.package(url: "https://github.com/mohl/mohl-ios", from: "2.4.0")\n\n// AppDelegate.swift\nimport MoHL\nMoHL.start(appKey: "${key}")`,
    Android:`// build.gradle\nimplementation "app.mohl:sdk:2.4.0"\n\n// Application.kt\nMoHL.start(this, appKey = "${key}")`,

    <div class="code">${esc(code)}</div>

    `<button class="btn plain" data-act="copy" data-v="${esc(code)}">${I('copy','s')} Copy code</button><button class="btn" data-act="verifysdk">${S.user.sdk?'Connected ✓':'Verify installation'}</button>`);

/* ---------- render ---------- */
function render(){
  const root = $('#root');
  root.innerHTML = S.user ? appView() : authView();
  if(S.user) afterRender();
}
function afterRender(){
  if(S.route==='utm') updUtm();
  if(S.route==='deeplinks') updDl();
  const m = $('#msgs'); if(m) m.scrollTop = m.scrollHeight;
}
function go(r, opts={}){
  if(!ROUTES[r]) r = 'dashboard';
  S.route = r; S.side = false; S.pop = null; closeModal();
  try{ history.replaceState(null,'','#'+r); }catch(e){}
  render(); if(!opts.keepScroll) window.scrollTo(0,0);
}
function authHash(){ const t = {login:'login', signup1:'signup'}[S.auth]; try{ history.replaceState(null,'', t ? '#'+t : location.pathname); }catch(e){} }
function login(user){
  S.user = user; S.err = {}; S.su = {};
  if(!user.ws) user.ws = newWorkspace(user.demo);
  store.set('mohl.session', user.email);
  const h = (location.hash||'').slice(1);
  go(ROUTES[h] && h!=='abtest' ? h : 'dashboard');
}
function logout(){ store.del('mohl.session'); S.user = null; S.auth = 'landing'; S.pop = null; closeModal(); try{ history.replaceState(null,'',location.pathname); }catch(e){} render(); toast('Signed out','logout'); }

/* live updates */
function updUtm(){
  const v = id => ($('#u-'+id)?.value||'').trim();
  let base = v('url') || 'https://example.com';
  const ps = [['utm_source','source'],['utm_medium','medium'],['utm_campaign','campaign'],['utm_term','term'],['utm_content','content']].filter(p=>v(p[1])).map(p=>p[0]+'='+encodeURIComponent(v(p[1])));
  const out = base + (ps.length ? (base.includes('?')?'&':'?') + ps.join('&') : '');
  $('#u-out').textContent = out; return out;
}
function slug(s){ return (s||'link').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,32) || 'link'; }
function updDl(){
  const name = $('#dl-name').value, scr = $('#dl-screen').value, prm = $('#dl-param').value.trim();
  const app = slug(appName());
  const url = `https://mohl.link/${app}/${slug(name||scr)}`;
  $('#dl-out').textContent = `${url}\n→ ${app}://${slug(scr)}${prm?'?'+prm:''}`;
  $('#dl-dest').textContent = scr; return {url, screen:scr};
}
function pwScore(p){ let s=0; if(p.length>=8)s++; if(/[A-Z]/.test(p))s++; if(/\d/.test(p))s++; if(/[^A-Za-z0-9]/.test(p)||p.length>=12)s++; return s; }

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'), t = e.target.closest('[data-act]');
  if(g && (!t || t.contains(g) && t !== g)){ e.preventDefault(); return go(g.dataset.go); }
  if(!t){ if(S.pop && !e.target.closest('.pop')){ S.pop=null; render(); } return; }
  const a = t.dataset.act, v = t.dataset.v;
  if(a==='closem' && t.classList.contains('scrim') && e.target !== t) return;
  switch(a){
    case 'auth': S.auth = v; S.err = {}; authHash(); render(); window.scrollTo(0,0); break;
    case 'lpgo': { const el = $('#lp-'+v); if(el) window.scrollTo({top: v==='top' ? 0 : el.getBoundingClientRect().top + scrollY - 76, behavior:'smooth'}); break; }
    case 'oauth': toast('Single sign-on is not connected in this prototype. Use email instead.','lock'); break;
    case 'peek': { const i = t.parentElement.querySelector('input'); i.type = i.type==='password'?'text':'password'; break; }
    case 'demo': login(S.users[DEMO_EMAIL]); toast('Opened the demo workspace'); break;
    case 'pick': S.su[t.dataset.k] = v; S.su.company = $('#su-company')?.value ?? S.su.company; render(); break;
    case 'pickm': { S.su.company = $('#su-company')?.value ?? S.su.company; const arr = S.su[t.dataset.k] ||= []; const i = arr.indexOf(v); i>=0 ? arr.splice(i,1) : arr.push(v); render(); break; }
    case 'logout': logout(); break;
    case 'side': S.side = !S.side; render(); break;
    case 'theme': { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; store.set('mohl.theme', r.dataset.theme); render(); break; }
    case 'pop': S.pop = S.pop===v ? null : v; render(); break;
    case 'readall': S.user.readNotif = true; persist(); S.pop = null; render(); toast('All notifications marked as read'); break;
    case 'navgroup': { const grp = t.dataset.g; if(S.route===t.dataset.r || NAV.find(n=>n.g===grp).kids.includes(S.route)){ S.collapsed[grp] = !S.collapsed[grp]; render(); } else { S.collapsed[grp]=false; go(t.dataset.r); } break; }
    case 'palette': S.pop=null; render(); openPalette(); break;
    case 'closem': closeModal(); break;
    case 'sdk': S.pop=null; render(); sdkModal(); break;
    case 'sdktab': sdkModal(v); break;
    case 'verifysdk': {
      if(S.user.sdk){ closeModal(); break; }
      $('#sdk-status').innerHTML = `<div class="row" style="color:var(--accent)"><span class="spin"></span> Waiting for the first event from your app…</div>`; t.disabled = true;
      setTimeout(()=>{ S.user.sdk = true; S.user.ws.threads = null; persist(); closeModal(); render(); toast('SDK connected. Sample data is loaded so you can explore.'); }, 1400);
      break; }
    case 'disconnect': S.user.sdk = false; S.user.ws.threads = null; persist(); render(); toast('SDK disconnected','x'); break;
    case 'copy': copyText(v); break;
    case 'wf': S.wfTab = v; S.wfStep = 1; S.wfCh = WF[v].channels[0]; go('workflows'); break;
    case 'wfsel': S.wfSel[S.wfTab] = +t.dataset.i; S.wfStep = 1; S.wfCh = WF[S.wfTab].channels[0]; render(); break;
    case 'wfstep': { const st = WF[S.wfTab].items[S.wfSel[S.wfTab]].steps[+t.dataset.i]; if(st[0]==='trig'||st[0]==='wait'){ toast('This step is preset in the template. You can edit message steps.','lock'); break; } S.wfStep = +t.dataset.i; S.wfCh = st[0]==='alt' ? WF[S.wfTab].channels[1] : WF[S.wfTab].channels[0]; render(); break; }
    case 'wfch': S.wfCh = v; S.wfStep = v===WF[S.wfTab].channels[1] ? 3 : 1; render(); break;
    case 'jsel': S.jSel = +t.dataset.i; S.jStep = 1; render(); break;
    case 'jstep': { const st = JOURNEYS[S.jSel].steps[+t.dataset.i]; if(st[0]==='trig'||st[0]==='wait'){ toast('This step is preset in the template. You can edit message steps.','lock'); break; } S.jStep = +t.dataset.i; render(); break; }
    case 'usewf': { const key = t.dataset.key; W().live[key] = !W().live[key]; persist(); render(); toast(W().live[key] ? `${t.dataset.n} is live` : `${t.dataset.n} is paused`, W().live[key]?'play':'clock'); break; }
    case 'previewmsg': previewMsg(); break;
    case 'plat': { const ps = S.platforms; S.platforms = v==='google' ? (ps.includes('google') ? [] : ['google']) : ps.includes(v) ? ps.filter(x=>x!==v) : [...ps.filter(x=>x!=='google'), v]; keepLaunchForm(()=>render()); break; }
    case 'ctype': $('#cl-type').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b===t)); $('#pv-type').textContent = v; break;
    case 'launch': submitLaunch(v); break;
    case 'togglecamp': { const c = W().campaigns[+t.dataset.i]; c.status = c.status==='Active' ? 'Paused' : 'Active'; persist(); render(); toast(`${c.name} is ${c.status.toLowerCase()}`); break; }
    case 'copyutm': copyText(updUtm()); break;
    case 'saveutm': { const l = updUtm(); if(!W().utm.includes(l)){ W().utm.unshift(l); persist(); } go('utm',{keepScroll:true}); toast('Link saved'); break; }
    case 'selcust': S.cust.sel = v; if(t.dataset.goto) go('customers'); else render(); break;
    case 'stagefilter': S.cust.stage = v; S.cust.q=''; go('customers'); break;
    case 'contact': { const c = allCustomers().find(x=>x.id===S.cust.sel); if(!c) break; const th = threads(); let x = th.find(y=>y.id===c.id); if(!x){ x = {id:c.id,name:c.name,ch:v,time:nowTime(),msgs:[]}; th.unshift(x); } x.ch = v; persist(); S.conv = {f:'All', sel:c.id}; go('conversations'); break; }
    case 'addcust': addCustomerModal(); break;
    case 'page': toast('Showing sample rows only in this prototype','file'); break;
    case 'seg': S.seg = +t.dataset.i; render(); break;
    case 'newseg': newSegModal(); break;
    case 'convf': S.conv.f = v; render(); break;
    case 'convsel': S.conv.sel = v; render(); break;
    case 'abopen': S.ab = v; go('abtest'); break;
    case 'edittest': editTestModal(); break;
    case 'runtest': { const st = W().tests[S.ab] ||= {split:50, goal:TESTS.find(x=>x.id===S.ab).goal}; st.running = !st.running; persist(); render(); toast(st.running?'Test started. Traffic is now split between both variants.':'Test stopped', st.running?'play':'clock'); break; }
    case 'newtest': newTestModal(); break;
    case 'agent': agentModal(v); break;
    case 'report': S.reportSel = +t.dataset.i; render(); break;
    case 'newreport': newReportModal(); break;
    case 'pal-go': closeModal(); go(v); break;
    case 'noop': break;
    case 'modal-save': modalSave(t); break;
  }
});
function keepLaunchForm(fn){
  const ids = ['cl-name','cl-link','cl-loc','cl-age','cl-gender','cl-int','cl-btype','cl-amount','cl-start','cl-end','cl-head','cl-text','cl-cta'];
  const vals = Object.fromEntries(ids.map(i=>[i,$('#'+i)?.value]));
  const type = $('#cl-type .on')?.dataset.v;
  fn();
  ids.forEach(i=>{ if($('#'+i) && vals[i]!=null) $('#'+i).value = vals[i]; });
  if(type){ $('#cl-type').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===type)); $('#pv-type').textContent = type; }
  liveLaunch();
}
function platNames(){
  const pn = Object.fromEntries(PLATFORMS), n = S.platforms.map(x=>pn[x]);
  return n.length ? n.length>1 ? n.slice(0,-1).join(', ')+' and '+n.at(-1) : n[0] : 'your chosen platforms';
}
function liveLaunch(){
  if(!$('#pv-head')) return;
  $('#pv-head').textContent = $('#cl-head').value || 'Your ad headline';
  $('#pv-text').textContent = $('#cl-text').value || `Your ad text will appear here. This is a preview of how your ad will look on ${platNames()}.`;
  $('#pv-cta').textContent = $('#cl-cta').value;
}
function submitLaunch(status){
  const name = $('#cl-name').value.trim() || 'Untitled campaign', link = $('#cl-link').value.trim(), amt = +$('#cl-amount').value;
  const lE = $('#cl-link-err'), aE = $('#cl-amount-err');
  lE.hidden = !!link || status==='Draft'; aE.hidden = amt>0 || status==='Draft';
  if(!S.platforms.length){ toast('Pick at least one platform','target'); $('#plat-hint')?.scrollIntoView({block:'center',behavior:'smooth'}); return; }
  if(status!=='Draft' && (!link || !(amt>0))){ (!link?$('#cl-link'):$('#cl-amount')).focus(); return; }
  const objective = $('#cl-type .on').dataset.v, multi = S.platforms.length > 1;
  [...S.platforms].reverse().forEach(pf => W().campaigns.unshift({name, objective, platform:pf, link:'https://mohl.link/c/'+slug(name)+(multi?'-'+pf:''), status, users:0, ctr:0, conv:0}));
  persist(); S.creative = null; go('campaigns');
  toast(status==='Draft' ? `${name} saved as a draft` : `${name} launched on ${platNames()}`, status==='Draft'?'save':'rocket');
}

function modalSave(t){
  const v = t.dataset.v;
  if(v==='cust'){ const n = $('#ac-name').value.trim(); if(!n){ $('#ac-err').hidden=false; return; }
    const c = {id:'C-'+(2000+W().customers.length), name:n, app:$('#ac-app').value, stage:$('#ac-stage').value, last:'Today', value:0, source:$('#ac-src').value, segment:'—', journey:'—'};
    W().customers.unshift(c); persist(); closeModal(); S.cust = {...S.cust, sel:c.id, q:'', stage:'All stages', plat:'All platforms'}; go('customers'); toast(`${n} added`); }
  if(v==='seg'){ const n = $('#ns-name').value.trim(); if(!n){ $('#ns-err').hidden=false; return; }
    W().segments.push({name:n, stage:$('#ns-stage').value, icon:'nodes', desc:$('#ns-desc').value.trim()||'Custom segment.', count:0, cond:[['Lifecycle stage','is',$('#ns-stage').value]]}); persist(); closeModal(); S.seg = SEGMENTS.length + W().segments.length - 1; go('segments'); toast(`${n} created`); }
  if(v==='test'){ const st = W().tests[S.ab] ||= {}; st.goal = $('#et-goal').value; st.split = +$('#et-split').value; persist(); closeModal(); render(); toast('Test updated'); }
  if(v==='agent'||v==='agent-off'){ const n = t.dataset.n; W().agents[n] = {on: v==='agent', ch:$('#ag-ch').value, when:$('#ag-when').value, to:$('#ag-to').value}; persist(); closeModal(); render(); toast(v==='agent'?`${n} is active`:`${n} turned off`, v==='agent'?'checkc':'x'); }
  if(v==='report'){ const n = $('#nr-name').value.trim(), ms = [...document.querySelectorAll('.nr-m:checked')].map(x=>x.value); if(!n||!ms.length){ $('#nr-err').hidden=false; return; }
    W().reports.unshift({name:n, metrics:ms, updated:'Just now'}); persist(); closeModal(); S.reportSel = 0; render(); toast(`${n} created`); }
}

document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if(!f) return; e.preventDefault();
  const kind = f.dataset.form;
  if(kind==='login'){
    const email = $('#li-email').value.trim().toLowerCase(), pw = $('#li-pw').value; S.su.email = email; S.err = {};
    if(!/^\S+@\S+\.\S+$/.test(email)) S.err.email = 'Enter a valid email address, like you@company.com.';
    if(!pw) S.err.pw = 'Enter your password.';
    if(Object.keys(S.err).length) return render();
    const u = S.users[email];
    if(email===DEMO_EMAIL){ login(u); return; }
    if(!u){ S.err.email = 'No account uses this email. Check the spelling or create an account.'; return render(); }
    if(u.hash !== await hash(pw)){ S.err.pw = 'That password is incorrect. Try again or reset it.'; return render(); }
    login(u); toast(`Welcome back, ${u.name.split(' ')[0]}`);
  }
  if(kind==='signup1'){
    const name = $('#su-name').value.trim(), email = $('#su-email').value.trim().toLowerCase(), pw = $('#su-pw').value, terms = $('#su-terms').checked;
    Object.assign(S.su, {name, email, terms}); S.err = {};
    if(name.length<2) S.err.name = 'Enter your full name.';
    if(!/^\S+@\S+\.\S+$/.test(email)) S.err.email = 'Enter a valid email address, like you@company.com.';
    else if(S.users[email]) S.err.email = 'An account already uses this email. Sign in instead.';
    if(pw.length<8) S.err.pw = 'Use at least 8 characters.';
    if(!terms) S.err.terms = 'Accept the terms to continue.';
    if(Object.keys(S.err).length) return render();
    S.su.hash = await hash(pw); S.auth = 'signup2'; render();
  }
  if(kind==='signup2'){
    const company = $('#su-company').value.trim(); S.su.company = company; S.err = {};
    if(!company){ S.err.company = 'Add your company or app name.'; return render(); }
    const su = S.su;
    const u = {name:su.name, email:su.email, hash:su.hash, role:su.role||'Marketing Manager', company, platform:su.platform||'iOS & Android', goals:su.goals||[], demo:false, sdk:false, ws:newWorkspace(false), created:Date.now()};
    S.users[u.email] = u; saveUsers(); login(u);
    modal('Your workspace is ready', `<div class="row" style="gap:16px"><span class="bubble lg">${I('checkc')}</span><div><h3>Welcome to MoHL, ${esc(u.name.split(' ')[0])}</h3><p class="muted small">${esc(company)} is set up. Here's how to start.</p></div></div>
      <div class="stack" style="gap:8px">${[['code','Connect your app','Add the SDK so MoHL can measure installs and events.','sdk'],['rocket','Launch your first campaign','Pick a platform, set a budget and go live.','go:launcher'],['fork','Turn on a journey','Welcome new users with a ready-made workflow.','go:journeys']].map(s=>`<button class="tile" ${s[3].startsWith('go:')?`data-go="${s[3].slice(3)}"`:`data-act="${s[3]}"`}><span class="bubble sm">${I(s[0],'s')}</span><div><b>${s[1]}</b><small>${s[2]}</small></div>${I('right','s')}</button>`).join('')}</div>`,
      `<button class="btn" data-act="closem">Go to dashboard</button>`);
  }
  if(kind==='forgot'){
    const email = $('#fp-email').value.trim(); S.su.email = email; S.err = {};
    if(!/^\S+@\S+\.\S+$/.test(email)){ S.err.email = 'Enter a valid email address.'; return render(); }
    S.auth = 'forgotSent'; render();
  }
  if(kind==='launch') submitLaunch('Active');
  if(kind==='deeplink'){ const d = updDl(); d.name = $('#dl-name').value.trim() || d.screen; W().links.unshift(d); persist(); go('deeplinks',{keepScroll:true}); toast('Deep link created','link'); }
  if(kind==='content'){
    const key = f.dataset.key, ch = f.dataset.ch, c = {message:$('#ct-message').value};
    if($('#ct-subject')) c.subject = $('#ct-subject').value; if($('#ct-button')) c.button = $('#ct-button').value;
    W().content[key+':'+ch] = c; persist(); toast('Content saved','save');
  }
  if(kind==='send'){
    const i = $('#cv-msg'), txt = i.value.trim(); if(!txt) return;
    const th = threads().find(t=>t.id===S.conv.sel) || threads()[0]; if(!th) return;
    const tm = nowTime(); th.msgs.push(['out',txt,tm]); th.time = tm; persist(); render(); $('#cv-msg')?.focus();
    setTimeout(()=>{ if(S.route!=='conversations') return; th.msgs.push(['in','Thanks, that helps.',nowTime()]); persist(); if(S.conv.sel===th.id) { render(); $('#cv-msg')?.focus(); } }, 1800);
  }
  if(kind==='profile'){
    const u = U(); u.name = $('#pf-name').value.trim() || u.name; u.role = $('#pf-role').value; u.company = $('#pf-company').value.trim() || u.company;
    const pw = $('#pf-pw')?.value; if(pw){ if(pw.length<8){ toast('Use at least 8 characters for the new password','x'); return; } u.hash = await hash(pw); }
    persist(); render(); toast('Settings saved');
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.bind){
    const path = t.dataset.bind.split('.'); let o = S; while(path.length>1) o = o[path.shift()]; o[path[0]] = t.type==='number'||t.id==='range' ? +t.value : t.value;
    const id = t.id, pos = t.selectionStart; render(); const n = document.getElementById(id); if(n){ n.focus(); if(pos!=null && n.setSelectionRange && n.type!=='select-one') try{ n.setSelectionRange(pos,pos); }catch(_){} }
    return;
  }
  if(t.hasAttribute('data-live')) liveLaunch();
  if(t.hasAttribute('data-utm')) updUtm();
  if(t.hasAttribute('data-dl')) updDl();
  if(t.hasAttribute('data-strength')){ const s = pwScore(t.value), cols = ['var(--bad)','var(--warn)','var(--f2)','var(--good)']; $('#pw-strength').querySelectorAll('i').forEach((b,i)=>b.style.background = i<s ? cols[s-1] : ''); $('#pw-hint').textContent = ['Use 8+ characters with a number and a capital letter.','Weak password','Fair password','Good password','Strong password'][s]; }
  if(t.id==='pal-q'){ const q = t.value.toLowerCase(); let first = true; document.querySelectorAll('#pal-list button').forEach(b=>{ const show = b.textContent.toLowerCase().includes(q); b.hidden = !show; b.classList.toggle('on', show && first); if(show) first=false; }); }
  if(t.dataset.actInput==='convq'){ const q = t.value.toLowerCase(); document.querySelectorAll('#inbox-list .inbox-item').forEach(b=>b.hidden = !b.dataset.name.includes(q)); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.bind && t.tagName==='SELECT'){ /* handled by input */ }
  if(t.id==='cl-file' && t.files[0]){ const r = new FileReader(); r.onload = () => { S.creative = r.result; keepLaunchForm(()=>render()); toast('Creative added','image'); }; r.readAsDataURL(t.files[0]); }
  if(t.dataset.actChange==='notif'){ W().notif[t.dataset.v] = t.checked; persist(); toast('Notification setting saved'); }
  if(t.dataset.actChange==='cond'){ toast('Condition updated','nodes'); }
});
document.addEventListener('keydown', e => {
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k' && S.user){ e.preventDefault(); openPalette(); }
  if(e.key==='Escape'){ if($('#modal-root').innerHTML){ closeModal(); } else if(S.pop||S.side){ S.pop=null; S.side=false; render(); } }
  if(e.key==='Enter' && e.target.id==='pal-q'){ const b = $('#pal-list button.on'); if(b){ closeModal(); go(b.dataset.v); } }
});

/* ---------- boot ---------- */
(function(){
  const th = store.get('mohl.theme', null); if(th) document.documentElement.dataset.theme = th;
  const em = store.get('mohl.session', null);
  if(em && S.users[em]){ S.user = S.users[em]; if(!S.user.ws) S.user.ws = newWorkspace(S.user.demo); const h = (location.hash||'').slice(1); S.route = ROUTES[h] && h!=='abtest' ? h : 'dashboard'; }
  else { const h = (location.hash||'').slice(1); S.auth = h==='login' ? 'login' : h==='signup' ? 'signup1' : 'landing'; }
  render();
})();
</script>
</body>
</html>
